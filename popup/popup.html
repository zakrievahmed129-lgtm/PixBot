<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixPilot</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="popup-container">
    <div class="popup-header">
      <div class="pp-term-dots">
        <span class="pp-dot red"></span>
        <span class="pp-dot yellow"></span>
        <span class="pp-dot green"></span>
      </div>
      <div class="popup-brand">
        <span class="popup-prompt">pix:~$</span>
        <h1>pixpilot</h1>
      </div>
      <div id="status-dot" class="status-dot" title="Statut API"></div>
    </div>

    <div class="popup-content">
      <div class="shield-status-card">
        <div class="shield-card-left">
          <span class="shield-card-icon">🛡️</span>
          <div class="shield-card-text">
            <div class="shield-card-title">Anti-Détection Pix</div>
            <div class="shield-card-desc">Écouteurs onglet &amp; souris neutralisés</div>
          </div>
        </div>
        <span class="shield-status-pill">ACTIF</span>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="api-key" class="label">Clé API</label>
          <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noreferrer" class="link-subtle">AI
            Studio ↗</a>
        </div>
        <div class="input-wrapper">
          <input type="password" id="api-key" placeholder="AIzaSy..." autocomplete="off">
          <button id="toggle-key-visibility" class="btn-eye" type="button" title="Afficher/Masquer">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="model-select" class="label">Modèle</label>
        <select id="model-select">
          <option value="gemini-2.5-flash">gemini-2.5-flash</option>
          <option value="gemini-2.0-flash-lite">gemini-2.0-flash-lite</option>
          <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite</option>
          <option value="gemini-1.5-flash">gemini-1.5-flash</option>
          <option value="custom">Personnalisé...</option>
        </select>
        <input type="text" id="custom-model-input" placeholder="ex: gemini-2.5-pro"
          style="display:none; margin-top: 6px;">
      </div>

      <button id="save-btn" class="btn-primary">Enregistrer</button>
      <div id="save-feedback" class="feedback">Enregistré ✓</div>

      <div class="popup-footer">
        <div class="shortcut-badge"><kbd>Alt</kbd> + <kbd>P</kbd></div>
        <a href="https://app.pix.fr" target="_blank" class="btn-link">pix.fr ↗</a>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
