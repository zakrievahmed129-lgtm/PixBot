<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixPilot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <div class="popup-brand">
        <div class="popup-logo">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
        </div>
        <div class="popup-title-group">
          <h1>PixPilot</h1>
          <span class="popup-subtitle">Assistant IA Épuré pour Pix</span>
        </div>
      </div>
      <div id="status-dot" class="status-dot" title="Statut de l'API"></div>
    </div>

    <div class="popup-content">
      <div class="form-group">
        <label for="api-key" class="label">Clé API Google Gemini</label>
        <div class="input-wrapper">
          <input type="password" id="api-key" placeholder="AIzaSy..." autocomplete="off">
          <button id="toggle-key-visibility" class="btn-eye" type="button" title="Afficher/Masquer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <div class="hint">
          Clé gratuite disponible sur <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noreferrer">Google AI Studio</a>.
        </div>
      </div>

      <div class="form-group">
        <label for="model-select" class="label">Modèle d'Intelligence Artificielle</label>
        <select id="model-select">
          <option value="gemini-2.5-flash">Gemini 2.5 Flash (Recommandé)</option>
          <option value="gemini-2.0-flash-lite">Gemini 2.0 Flash Lite (Ultra rapide)</option>
          <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash Lite</option>
          <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
          <option value="custom">Modèle personnalisé...</option>
        </select>
        <input type="text" id="custom-model-input" placeholder="ex: gemini-3.1-flash-lite" style="display:none; margin-top: 6px;">
      </div>

      <button id="save-btn" class="btn-primary">Enregistrer la configuration</button>
      <div id="save-feedback" class="feedback">Configuration enregistrée ✓</div>

      <hr class="divider">

      <div class="shortcut-info">
        <span>Raccourci clavier sur Pix :</span>
        <kbd>Alt</kbd> + <kbd>P</kbd>
      </div>

      <div class="links-group">
        <a href="https://app.pix.fr" target="_blank" class="btn-link">Ouvrir Pix.fr →</a>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
