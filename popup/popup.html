<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixPilot</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="popup-container">
    <div class="popup-header">
      <div class="popup-brand">
        <span class="popup-prompt"><span class="caret">&gt;_</span>pix<span class="cursor-mini"></span></span>
        <span class="popup-sub">cmd</span>
      </div>
      <div id="status-dot" class="status-dot" title="Statut API"></div>
    </div>

    <div class="popup-content">
      <div class="shield-status-card">
        <div class="shield-card-left">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" class="shield-icon">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            <polyline points="9 12 11 14 15 10" />
          </svg>
          <div class="shield-card-text">
            <div class="shield-card-title">bouclier_vie_privee</div>
            <div class="shield-card-desc">onglet &amp; souris neutralisés</div>
          </div>
        </div>
        <span class="shield-status-pill">ACTIF</span>
      </div>

      <div class="toggles-card">
        <label class="toggle-row">
          <span class="toggle-label">auto_apply</span>
          <span class="pp-switch">
            <input type="checkbox" id="opt-auto-apply">
            <span class="pp-switch-track"></span>
            <span class="pp-switch-thumb"></span>
          </span>
        </label>
        <label class="toggle-row">
          <span class="toggle-label">mode_discret</span>
          <span class="pp-switch">
            <input type="checkbox" id="opt-ghost-mode">
            <span class="pp-switch-track"></span>
            <span class="pp-switch-thumb"></span>
          </span>
        </label>
        <label class="toggle-row">
          <span class="toggle-label">format_compact</span>
          <span class="pp-switch">
            <input type="checkbox" id="opt-compact-mode">
            <span class="pp-switch-track"></span>
            <span class="pp-switch-thumb"></span>
          </span>
        </label>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="api-key" class="label">cle_api</label>
          <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noreferrer" class="link-subtle">AI
            Studio ↗</a>
        </div>
        <div class="input-wrapper">
          <input type="password" id="api-key" placeholder="AIzaSy..." autocomplete="off">
          <button id="toggle-key-visibility" class="btn-eye" type="button" title="Afficher/Masquer">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="model-select" class="label">modele</label>
        <select id="model-select">
          <option value="gemini-2.5-flash">gemini-2.5-flash</option>
          <option value="gemini-2.0-flash-lite">gemini-2.0-flash-lite</option>
          <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite</option>
          <option value="gemini-1.5-flash">gemini-1.5-flash</option>
          <option value="custom">Personnalisé...</option>
        </select>
        <input type="text" id="custom-model-input" placeholder="ex: gemini-2.5-pro"
          style="display:none; margin-top: 6px;">
      </div>

      <button id="save-btn" class="btn-primary">$ save --apply</button>
      <div id="save-feedback" class="feedback">config saved ✓</div>

      <div class="popup-footer">
        <div class="shortcut-badge"><kbd>Alt</kbd>+<kbd>P</kbd></div>
        <a href="https://app.pix.fr" target="_blank" class="btn-link">pix.fr ↗</a>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
